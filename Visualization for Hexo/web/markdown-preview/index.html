<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown Preview</title>
  <link rel="stylesheet" href="qrc:/preview/vendor/highlight/github.min.css" />
  <style>
    :root {
      --fg: #24292f;
      --fg-muted: #57606a;
      --bg: #ffffff;
      --border: #d0d7de;
      --accent: #0969da;
      --accent-weak: rgba(9, 105, 218, 0.15);
      --code-bg: #f6f8fa;
      --inline-code-bg: rgba(175, 184, 193, 0.2);
      --body-font-size: 17px;
      --body-line-height: 1.8;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif;
      font-size: var(--body-font-size);
      line-height: var(--body-line-height);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide native document scrollbars so the host app's scrollbar controls scrolling.
       Keep content layout unchanged; the outer UI (QML) should provide scrolling. */
    body {
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE 10+ */
    }
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      background: transparent;
    }

    .markdown-body {
      box-sizing: border-box;
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 20px 30px 34px;
      color: var(--fg);
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .markdown-body > *:first-child { margin-top: 0; }
    .markdown-body > *:last-child { margin-bottom: 0; }
    .markdown-body p { margin: 0 0 16px 0; }
    .markdown-body p + p { margin-top: 2px; }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      margin: 24px 0 16px;
      line-height: 1.26;
      font-weight: 700;
      color: #1f2328;
    }
    .markdown-body h1 { font-size: 2em; padding-bottom: 0.32em; border-bottom: 1px solid var(--border); }
    .markdown-body h2 { font-size: 1.56em; padding-bottom: 0.24em; border-bottom: 1px solid var(--border); }
    .markdown-body h3 { font-size: 1.32em; }
    .markdown-body h4 { font-size: 1.12em; }
    .markdown-body h5 { font-size: 1em; }
    .markdown-body h6 { font-size: 0.92em; color: var(--fg-muted); }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .markdown-body ul, .markdown-body ol {
      margin: 0 0 16px 1.4em;
      padding: 0;
    }
    .markdown-body li { margin: 0.28em 0; }
    .markdown-body li > p { margin: 0.36em 0; }

    .markdown-body input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #2f81f7;
      margin-right: 6px;
      vertical-align: -2px;
    }

    .markdown-body blockquote {
      margin: 0 0 16px;
      padding: 0 1em;
      color: #4b5563;
      border-left: 4px solid #d0d7de;
      background: #fafbfc;
      border-radius: 0 8px 8px 0;
    }
    .markdown-body blockquote p { margin-bottom: 8px; }
    .markdown-body blockquote p:last-child { margin-bottom: 0; }

    .markdown-body hr {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .markdown-body table {
      border-collapse: collapse;
      margin: 0 0 18px;
      width: max-content;
      min-width: 100%;
      max-width: 100%;
      overflow: auto;
      display: block;
      border-radius: 8px;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid #d8dee4;
      padding: 8px 13px;
      text-align: left;
      vertical-align: top;
    }
    .markdown-body th {
      background: #f6f8fa;
      font-weight: 600;
    }
    .markdown-body tr:nth-child(2n) td {
      background: rgba(234, 238, 242, 0.32);
    }

    .markdown-body code {
      font-family: "Cascadia Mono", "JetBrains Mono", "Consolas", "Courier New", monospace;
      font-size: 0.9em;
      padding: 0.18em 0.36em;
      border-radius: 6px;
      background: var(--inline-code-bg);
      color: #1f2328;
    }

    .markdown-body pre {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #d8dee4;
      background: var(--code-bg);
      overflow: auto;
      line-height: 1.58;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    .markdown-body pre::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    .markdown-body pre::-webkit-scrollbar-thumb {
      background: rgba(88, 103, 122, 0.62);
      border: 2px solid transparent;
      background-clip: content-box;
      border-radius: 6px;
    }

    .markdown-body pre code {
      display: block;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-size: 0.9em;
      color: #1f2328;
    }

    .markdown-body img {
      display: block;
      margin: 14px auto;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid rgba(208, 215, 222, 0.68);
    }

    .markdown-body :target {
      background: var(--accent-weak);
      border-radius: 4px;
      padding-left: 3px;
      padding-right: 3px;
      box-decoration-break: clone;
    }
  </style>
</head>
<body>
  <article id="preview" class="markdown-body"></article>

  <script src="qrc:/preview/vendor/highlight/highlight.min.js"></script>
  <script src="qrc:/preview/vendor/markdown/markdown-it.min.js"></script>
  <script src="qrc:/preview/vendor/markdown/markdown-it-task-lists.min.js"></script>
  <script>
    const container = document.getElementById("preview");
    let md = null;

    function createMarkdownEngine() {
      if (md || !window.markdownit) {
        return md;
      }

      md = window.markdownit({
        html: true,
        linkify: true,
        typographer: true,
        breaks: true,
        highlight(str, lang) {
          if (lang && window.hljs && window.hljs.getLanguage(lang)) {
            try {
              return `<pre><code class="hljs language-${lang}">${window.hljs.highlight(str, { language: lang, ignoreIllegals: true }).value}</code></pre>`;
            } catch (_) {}
          }
          if (window.hljs) {
            try {
              return `<pre><code class="hljs">${window.hljs.highlightAuto(str).value}</code></pre>`;
            } catch (_) {}
          }
          return `<pre><code>${md.utils.escapeHtml(str)}</code></pre>`;
        }
      });

      if (window.markdownitTaskLists) {
        md.use(window.markdownitTaskLists, { enabled: true, label: true });
      }

      const defaultLinkOpen = md.renderer.rules.link_open || function(tokens, idx, options, env, self) {
        return self.renderToken(tokens, idx, options);
      };
      md.renderer.rules.link_open = function(tokens, idx, options, env, self) {
        const token = tokens[idx];
        token.attrSet("target", "_blank");
        token.attrSet("rel", "noopener noreferrer");
        return defaultLinkOpen(tokens, idx, options, env, self);
      };

      return md;
    }

    function applyTypography(options) {
      const opts = options || {};
      const fontPx = Number(opts.bodyFontSize);
      const lineHeight = Number(opts.lineSpacing);

      if (Number.isFinite(fontPx) && fontPx >= 12 && fontPx <= 36) {
        document.documentElement.style.setProperty("--body-font-size", `${fontPx}px`);
      }
      if (Number.isFinite(lineHeight) && lineHeight >= 1.2 && lineHeight <= 2.6) {
        document.documentElement.style.setProperty("--body-line-height", String(lineHeight));
      }
    }

    window.__hexoCache = new Map();
    window.__hexoCacheMax = 10;

    function simpleHash(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
      }
      return String(h);
    }

    function renderMarkdown(markdownText, options) {
      const src = typeof markdownText === "string" ? markdownText : "";
      applyTypography(options);

      console.log('[HexoPreview] renderMarkdown called, len=', src.length, 'options=', options);

      const engine = createMarkdownEngine();
      if (engine) {
        try {
          container.innerHTML = engine.render(src);
          console.log('[HexoPreview] renderMarkdown set innerHTML, children=', container.children.length);
          container.dataset.renderMode = "markdown-it";
          return true;
        } catch (_) {
          console.error('[HexoPreview] renderMarkdown exception', _);
          // Keep preview alive even if parsing fails.
        }
      }

      container.dataset.renderMode = "plain-text";
      container.textContent = src;
      return false;
    }

    window.HexoPreview = {
      version: "vscode-like-2026.04.26",
      render: renderMarkdown
    };

    window.updateMarkdown = function(markdownText, options) {
      try {
        const src = typeof markdownText === "string" ? markdownText : "";
        const opts = options || {};
        const cacheKey = simpleHash(src + "|" + (opts.bodyFontSize || "") + "|" + (opts.lineSpacing || ""));

        // Check cache: if this exact content was rendered before, restore HTML directly
        const cached = window.__hexoCache.get(cacheKey);
        if (cached && cached.html !== undefined) {
          applyTypography(opts);
          container.innerHTML = cached.html;
          container.dataset.renderMode = "cached";
          console.log('[HexoPreview] updateMarkdown cache hit, key=', cacheKey);
          return true;
        }

        const ok = renderMarkdown(markdownText, options);
        if (ok) {
          // Store rendered HTML in cache
          window.__hexoCache.set(cacheKey, { html: container.innerHTML });
          if (window.__hexoCache.size > window.__hexoCacheMax) {
            const firstKey = window.__hexoCache.keys().next().value;
            window.__hexoCache.delete(firstKey);
          }
        }
        console.log('[HexoPreview] updateMarkdown ->', ok);
        return ok;
      } catch (e) {
        console.error('[HexoPreview] updateMarkdown error', e);
        throw e;
      }
    };

  </script>
</body>
</html>
